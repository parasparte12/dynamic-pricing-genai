services:
  # Ollama is never published to the host or the internet -- only reachable by
  # fastapi/streamlit over the internal `backend` network, via OLLAMA_HOST.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - backend
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # One-shot: pulls qwen2.5:7b into the ollama_data volume, then exits. Safe to
  # leave in `docker compose up` every time -- `ollama pull` is a no-op once the
  # model is already present locally.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - backend
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama", "pull", "qwen2.5:7b"]
    restart: "no"

  # Not published to the host either -- only reachable by streamlit, via API_BASE.
  fastapi:
    build: .
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  streamlit:
    build: .
    command: python -m streamlit run app/streamlit_app.py --server.address=0.0.0.0 --server.port=8501 --server.headless=true
    env_file:
      - .env
    environment:
      - API_BASE=http://fastapi:8000
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - fastapi
      - ollama
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # The only container reachable from the internet.
  nginx:
    image: nginx:stable-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - streamlit
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  ollama_data:
