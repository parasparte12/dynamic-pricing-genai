# Reverse proxy to the Streamlit frontend only. FastAPI and Ollama are not
# exposed here -- Streamlit reaches them over the internal Docker network
# (API_BASE / OLLAMA_HOST env vars), never through this proxy.
#
# Streamlit communicates with the browser over a WebSocket, so the
# Upgrade/Connection headers below are required -- without them the app loads
# once but reruns/widget updates silently stop working behind the proxy.
server {
    listen 80;
    server_name _;

    # Docker's embedded DNS (127.0.0.11) re-resolves `streamlit` on every request via this
    # variable, instead of nginx resolving it once at startup and caching that IP forever.
    # Without this, every future deploy (Phase 9: streamlit gets rebuilt/recreated, nginx does
    # not) leaves nginx pointing at the streamlit container's now-gone old IP -- a 502 that
    # only clears once nginx itself is also restarted. Confirmed while testing locally: after
    # recreating just the streamlit container, nginx kept returning 502 "connection refused"
    # to its stale cached IP until this fix was applied.
    resolver 127.0.0.11 valid=10s;

    location / {
        set $streamlit_upstream streamlit:8501;
        proxy_pass http://$streamlit_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /_stcore/health {
        set $streamlit_upstream streamlit:8501;
        proxy_pass http://$streamlit_upstream/_stcore/health;
    }
}
